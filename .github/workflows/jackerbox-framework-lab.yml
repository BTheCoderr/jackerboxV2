name: JackerBox isolated framework upgrade validation
on:
  push:
    branches:
      - upgrade/next16-tailwind4-validation-2026-10
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: upgrade/next16-tailwind4-validation-2026-10
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Resolve new dependency versions
        run: npm install --legacy-peer-deps
      - name: Generate Prisma Client
        run: npx prisma generate
      - name: Verify TypeScript
        run: npx tsc --noEmit
      - name: Verify all existing focused tests
        run: npx jest tests/unit/security-guardrails.test.ts tests/unit/rental-pricing.test.ts tests/unit/test-verification-guard.test.ts --runInBand
      - name: Attempt production build without Netlify deployment
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: '1'
      - name: Audit runtime vulnerabilities
        run: npm audit --omit=dev --audit-level=high
      - name: Record compatible upgrade lockfile on isolated branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: lock validated Next 16 and Tailwind 4 upgrade"
            git push origin HEAD:upgrade/next16-tailwind4-validation-2026-10
          fi
