name: JackerBox one-time safe dependency patch

on:
  push:
    branches:
      - audit/security-and-rental-hardening-2026-10
    paths:
      - .github/workflows/jackerbox-safe-audit-fix.yml

permissions:
  contents: write

jobs:
  safe-update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply non-breaking npm advisory fixes to lockfile
        run: npm audit fix --package-lock-only --ignore-scripts --legacy-peer-deps --no-fund || true
      - name: Validate updated lockfile
        run: |
          git diff --check
          node -e "const p=require('./package.json'); const l=require('./package-lock.json'); if(p.name!==l.name)process.exit(1)"
      - name: Commit safe lockfile updates only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- package.json package-lock.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "security: apply non-breaking npm advisory fixes [skip ci]"
          git push origin HEAD:audit/security-and-rental-hardening-2026-10
