name: JackerBox repair checks

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  security-and-unit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci --legacy-peer-deps
      - name: Generate Prisma client
        run: npx prisma generate
      - name: Verify security repair regression tests
        run: npx jest tests/unit/security-guardrails.test.ts tests/unit/rental-pricing.test.ts --runInBand
      - name: TypeScript diagnostics (release gate)
        run: npx tsc --noEmit
      - name: Dependency audit (release gate)
        if: always()
        run: npm audit --omit=dev --audit-level=high
