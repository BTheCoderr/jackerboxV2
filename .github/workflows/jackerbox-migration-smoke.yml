name: JackerBox isolated Postgres migration smoke
on:
  push:
    branches:
      - audit/migration-smoke-2026-10
permissions:
  contents: read
jobs:
  migrate-fresh-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: jackerbox
          POSTGRES_PASSWORD: isolated_test_password
          POSTGRES_DB: jackerbox_migrations
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U jackerbox -d jackerbox_migrations"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: postgresql://jackerbox:isolated_test_password@localhost:5432/jackerbox_migrations?schema=public
      DIRECT_DATABASE_URL: postgresql://jackerbox:isolated_test_password@localhost:5432/jackerbox_migrations?schema=public
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Reproducible dependency install
        run: npm ci --legacy-peer-deps
      - name: Validate schema formatting and generate client
        run: |
          npx prisma validate
          npx prisma generate
      - name: Apply historical migrations and seed legacy financial/message records
        run: |
          mv prisma/migrations/20261010130000_reconcile_legacy_schema /tmp/jackerbox_reconcile_migration
          npx prisma migrate deploy
          psql "postgresql://jackerbox:isolated_test_password@localhost:5432/jackerbox_migrations" -v ON_ERROR_STOP=1 -f tests/fixtures/legacy-schema-before.sql
          mv /tmp/jackerbox_reconcile_migration prisma/migrations/20261010130000_reconcile_legacy_schema
      - name: Apply safe reconciliation migration and verify surviving data
        run: |
          npx prisma migrate deploy
          psql "postgresql://jackerbox:isolated_test_password@localhost:5432/jackerbox_migrations" -v ON_ERROR_STOP=1 -f tests/fixtures/legacy-schema-after.sql
      - name: Verify migration status
        run: npx prisma migrate status
      - name: Verify migrations can be reapplied idempotently
        run: npx prisma migrate deploy
      - name: Review SQL needed to reconcile model drift (do not execute)
        run: npx prisma migrate diff --from-url "$DIRECT_DATABASE_URL" --to-schema-datamodel prisma/schema.prisma --script
      - name: Check migrated database against checked-in schema
        run: npx prisma migrate diff --from-url "$DIRECT_DATABASE_URL" --to-schema-datamodel prisma/schema.prisma --exit-code
      - name: Production type checks
        if: always()
        run: npx tsc --noEmit
