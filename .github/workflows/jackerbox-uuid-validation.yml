name: JackerBox UUID remediation validation
on:
  push:
    branches:
      - upgrade/uuid-remediation-2026-10
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: upgrade/uuid-remediation-2026-10
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Resolve patched UUID dependencies
        run: npm install --legacy-peer-deps
      - name: Generate Prisma client
        run: npx prisma generate
      - name: Verify UUID tree
        run: npm ls uuid --all
      - name: TypeScript
        run: npx tsc --noEmit
      - name: Security and UUID regressions
        run: npx jest --runInBand tests/unit/security-guardrails.test.ts tests/unit/rental-pricing.test.ts tests/unit/test-verification-guard.test.ts tests/unit/uuid-compatibility.test.ts
      - name: Full production build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: '1'
      - name: Production dependency audit, including moderate
        if: always()
        run: npm audit --omit=dev --audit-level=moderate
      - name: Commit validated lockfile
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: lock patched uuid dependencies"
            git push origin HEAD:upgrade/uuid-remediation-2026-10
          fi
