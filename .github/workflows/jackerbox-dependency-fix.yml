name: JackerBox one-time dependency repair

on:
  push:
    branches:
      - audit/security-and-rental-hardening-2026-10
    paths:
      - .github/workflows/jackerbox-dependency-fix.yml

permissions:
  contents: write

jobs:
  update-lock:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Update Next and React to patched stable releases
        run: npm install next@15.5.27 eslint-config-next@15.5.27 react@19.0.6 react-dom@19.0.6 --save-exact --package-lock-only --ignore-scripts --legacy-peer-deps --no-audit --no-fund
      - name: Check package changes
        run: git diff --check && git diff --stat -- package.json package-lock.json
      - name: Commit updated manifest and lock together
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- package.json package-lock.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "security: upgrade Next.js and React to patched releases [skip ci]"
          git push origin HEAD:audit/security-and-rental-hardening-2026-10
